import numpy as np

def select(pool, context, config):
    descending = bool(config.get("descending", True))
    order = np.argsort(pool.estimated_tokens, kind="stable")

import numpy as np

    chunks = [order[i : i + bucket_size].copy() for i in range(0, len(order), bucket_size)]

    return ranked[:count]
