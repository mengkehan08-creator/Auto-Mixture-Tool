# Runs inside one ModelArts training container. ModelArts is the outer
# scheduler, so the in-container executor must be local (never hpc-cluster).

dataset_uri: /home/ma-user/modelarts/inputs/data_dir_0
schema_uri: /home/ma-user/modelarts/user-job-dir/Auto-Mixture-Tool/configs/schema_stem_quadmix_parquet.yaml
dataset_id: quadmix
output_uri: /home/ma-user/modelarts/outputs/output_dir_0/auto_mixture
full_scan: false

dataset_config: {}

algorithm_id: quadmix
trainer_id: nanochat
training_data_adapter_id: none
evaluator_id: stem
executor_id: local

algorithm_config:
  # Two-node smoke test: 16 proxy experiments keep 2 x 8 NPUs busy once
  # distributed experiment scheduling is enabled.
  num_experiments: 16
  # Temporary integration setting: each proxy experiment trains for 15 steps.
  tiny_steps: 15
  num_search: 1000
  seed: 42
  device_type: npu
  npu_devices: 8
  algorithm_nodes: auto
  proxy_validation_set: stem_v2
  proxy_validation_path: /home/ma-user/modelarts/inputs/proxy_validation_dir_5/stem_v2_tokenized.pt
  tokenizer_path: /home/ma-user/modelarts/inputs/quadmix_tokenizer_dir_4

# QuaDMix remains the selected platform algorithm. Random and manual are
# comparison strategies that reuse the same token budget, then train/evaluate
# sequentially so the three runs do not compete for NPU memory.
comparison_config:
  methods:
    - quadmix
    - random
    - manual
  manual_ratios:
    数学: 0.60
    物理: 0.15
    化学: 0.125
    生物学: 0.125

trainer_config:
  npu_devices: 8
  target_param_data_ratio: 0.5
  nanochat_repo: /home/ma-user/modelarts/inputs/nanochat_npu_dir_3
  model_dir: /home/ma-user/modelarts/inputs/nanochat_model_dir_1
  eval_bundle_dir: /home/ma-user/modelarts/inputs/eval_bundle_dir_6
  skip_eval_download: true
  result_dir: /home/ma-user/modelarts/outputs/output_dir_0/nanochat_results
  checkpoint_dir: /home/ma-user/modelarts/outputs/output_dir_0/nanochat_checkpoints
  base_model_tag: d24

evaluator_config:
  benchmarks: stem
  tasks:
    - gsm8k
    - mmlu_stem
    - arc_easy

executor_config:
  device_type: npu
  device_count: 8
