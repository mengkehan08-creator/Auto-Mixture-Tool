[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mixture-tool"
version = "0.1.0"
description = "Auto-Mixture-Tool: pluggable data mixing platform with QuadMix, NanoChat training/validation, and cluster scheduling"
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "pandas>=2.0",
    "pyarrow>=10.0",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.scripts]
auto-mixture = "auto_mixture_tool.cli:main"
quadmix-platform = "quadmix_platform.cli:main"

[project.urls]
Homepage = "https://github.com/AutoDataMixture/Auto-Mixture-Tool"
Paper = "https://arxiv.org/abs/2504.16511"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quadmix*", "auto_mixture_tool*"]

[tool.setuptools.package-data]
quadmix = ["py.typed"]
auto_mixture_tool = ["api/static/*.html", "api/static/*.css"]
